<div class="tab column" style="display:none" id="metaverse">

						<div class="w3-button tabButtonMetaverse baritem" id="metaverseTab2TabButton" onClick="setTabMetaverse('metaverseTab2')"><span id="perks"></span></div>

<button class="w3-button button" id="hypercubeGainBuyButton" onclick="buyHypercubeGain()"></button>
								</div>
								<div id="ReduceBoostCooldownAltar" class="metaverse-item">

<button class="w3-button button" id="reduceBoostCooldownBuyButton" onclick="buyReduceBoostCooldown()"></button>
								</div>
								<div id="IncreaseBoostDurationAltar" class="metaverse-item">

									<div class="metaverse-cost"><span id="boostDurationCostLabel"></span>: <b id="boostDurationCost"></b> <span class="color-hypercubes" id="boostDurationCostCurrency"></span></div>
									<div class="metaverse-desc"><span id="boostDuration"></span></div>
<button class="w3-button button" id="boostDurationBuyButton" onclick="buyBoostDuration()"></button>
								</div>
								<div id="EvilAltar" class="metaverse-item">

									<div class="metaverse-desc"></div>
									<div class="metaverse-cost"><span id="evilTranCostLabel"></span>: <b id="evilTranCost"></b> <span class="color-hypercubes" id="evilTranCostCurrency"></span></div>
									<div class="metaverse-desc"><span id="evilTranGain"></span></div>
<button class="w3-button button" id="evilTranBuyButton" onclick="buyEvilTran()"></button>
								</div>
								<div id="EssenceAltar" class="metaverse-item">

									<div class="metaverse-desc"></div>
									<div class="metaverse-cost"><span id="essenceMultCostLabel"></span>: <b id="essenceMultCost"></b> <span class="color-hypercubes" id="essenceMultCostCurrency"></span></div>

<button class="w3-button button" id="essenceMultButton" onclick="buyEssenceMult()"></button>
								</div>
								<div id="ChallengeAltar" class="metaverse-item">

									<div class="metaverse-cost"><span id="darkMatterMultCostLabel"></span>: <b id="darkMatterMultCost"></b> <span class="color-hypercubes" id="darkMatterMultCostCurrency"></span></div>

<button class="w3-button button" id="darkMaterMultButton" onclick="buyDarkMaterMult()"></button>
								</div>
							</div>

						<div id="metaverseTab2" class="tabMetaverse">
