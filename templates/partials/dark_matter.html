<div class="tab column" id="darkMatter">
					<div id="tabcolumnDarkMater" class="panel subtab-column">
						<div class="tabButtonDarkMatter baritem tab-current" id="shopTabTabButton" onClick="setTabDarkMatter('shopTab')"><span id="dm_tab_shop"></span></div>
						<div class="tabButtonDarkMatter baritem" id="skillTreeTabTabButton" onClick="setTabDarkMatter('skillTreeTab')"><span id="dm_tab_abilities"></span></div>
					</div>
							<div id="maincolumnDarkMatter" class="panel main-column settings-main-column">
						<div id="shopTab" class="tabDarkMatter">
							<div id="shopTabPage" class="panel page-column padded">
								<div class="text-caption">
									<div class="text-caption"><span class="color-dark-matter"><span id="darkMatterShopCurrency"></span>:</span> <span id="darkMatterShopDisplay"></span></div>
								</div>
								<div id="darkMatterShopDarkMatter"></div>
								<div class="text-caption dark-matter-section">
									<div class="text-caption"><span class="color-dark-orbs"><span class="orb-text"><span id="dark_orbs_shop"></span>:</span></span> <span id="darkOrbsShopDisplay"></span></div>
								</div>
								<div id="darkMatterShopDarkOrbs"></div>
							<template id="darkMatterShopItemTemplate">
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="purchaseTitle"></div>
									<div class="dark-matter-desc"><span id="purchaseDesc"></span></div>
									<div class="dark-matter-desc" id="purchaseStateRow"><span class="dark-matter-green"><b id="purchaseState"></b></span></div>
									<div id="purchaseCost" class="dark-matter-cost"><span id="purchaseCostLabel"></span>: <b id="purchaseCostValue"></b> <span id="purchaseCurrencyWrap"><span id="purchaseCurrency"></span></span></div>
									<div id="purchaseProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="purchaseBuyButton"></button>
								</div>
							</template>
							</div>
						</div>
						<div id="skillTreeTab" class="tabDarkMatter">
							<div id="skillTreePage" class="panel page-column padded">
								<div id="skillTreePageDarkMaterDisplay" class="text-caption">
									<div class="text-caption"><span class="color-dark-matter"><span id="skillTreePageDarkMaterTitle"></span>:</span> <span id="darkMatterSkillsDisplay"></span></div>
								</div>
							<div class="dark-matter-item text-center">
								<div class="text-caption dark-matter-warning" id="abilities_warning"></div>
								<button class="button" id="resetAbilitiesButton" onclick="resetSkillTree()"></button>
							</div>
								<div id="darkMatterAbilityTree"></div>
								<template id="darkMatterAbilityTemplate">
									<div class="dark-matter-item">
										<div class="text-caption dark-matter-title" id="abilityTitle"></div>
										<div class="dark-matter-desc">
											<button id="abilityLevel1" class="button"></button> -
											<span id="abilityLevel1Desc"></span>
										</div>
										<div class="darkMatterSkillOR"></div>
										<div class="dark-matter-desc">
											<button id="abilityLevel2" class="button"></button> -
											<span id="abilityLevel2Desc"></span>
										</div>
										<div id="abilityCost" class="dark-matter-cost"><span id="abilityCurrencyLabel"></span>: <b id="abilityCostValue"></b> <span class="color-dark-matter" id="abilityCurrencyIcon"></span></div>
										<div id="abilityProgress" class="req-progress-container">
											<div class="req-pending-bar color-dark-matter"></div>
											<div class="req-progress-bar color-dark-matter"></div>
										</div>
									</div>
								</template>
							</div>
						</div>
					</div>
				</div>
