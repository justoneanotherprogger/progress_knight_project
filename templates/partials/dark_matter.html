<div class="tab column" id="darkMatter">
					<div id="tabcolumnDarkMater" class="panel subtab-column">
						<div class="tabButtonDarkMatter baritem tab-current" id="shopTabTabButton" onClick="setTabDarkMatter('shopTab')"><span id="dm_tab_shop"></span></div>
						<div class="tabButtonDarkMatter baritem" id="skillTreeTabTabButton" onClick="setTabDarkMatter('skillTreeTab')"><span id="dm_tab_abilities"></span></div>
					</div>
							<div id="maincolumnDarkMatter" class="panel main-column settings-main-column">
						<div id="shopTab" class="tabDarkMatter">
							<div id="shopTabPage" class="panel page-column padded">
								<div class="text-caption">
									<div class="text-caption"><span class="color-dark-matter"><span id="darkMatterShopCurrency"></span>:</span> <span id="darkMatterShopDisplay"></span></div>
								</div>
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="dark_orb_generator"></div>
									<div id="darkOrbGeneratorDesc" class="dark-matter-desc"></div>
									<div class="dark-matter-cost"><span id="darkOrbGeneratorCostLabel"></span>: <b id="darkOrbGeneratorCost"></b> <span class="color-dark-matter" id="darkOrbGeneratorCurrency"></span></div>
									<div id="darkOrbGeneratorProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="darkOrbGeneratorBuyButton" onclick="buyDarkOrbGenerator()"></button>
								</div>
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="a_miracle"></div>
									<div id="a_miracle_desc" class="dark-matter-desc"></div>
									<div class="dark-matter-desc"><span class="dark-matter-green"><b id="aMiracleState"></b></span></div>
									<div id="aMiracleCost" class="dark-matter-cost"><span id="aMiracleCostLabel"></span>: <b>10</b> <span class="color-dark-matter" id="aMiracleCurrency"></span></div>
									<div id="aMiracleProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="aMiracleBuyButton" onclick="buyAMiracle()"></button>
								</div>
								<div class="text-caption dark-matter-section">
									<div class="text-caption"><span class="color-dark-orbs"><span class="orb-text"><span id="dark_orbs_shop"></span>:</span></span> <span id="darkOrbsShopDisplay"></span></div>
								</div>
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="a_deal_with_chairman"></div>
									<div class="dark-matter-desc"><span id="aDealWithTheChairmanDesc"></span></div>
									<div class="dark-matter-cost"><span id="aDealWithTheChairmanCostLabel"></span>: <b id="aDealWithTheChairmanCost"></b> <span class="color-dark-orbs"><span class="orb-text" id="aDealWithTheChairmanCurrency"></span></span></div>
									<div id="aDealWithTheChairmanProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="aDealWithTheChairmanBuyButton" onclick="buyADealWithTheChairman()"></button>
								</div>
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="a_gift_from_god"></div>
									<div class="dark-matter-desc"><span id="aGiftFromGodDesc"></span></div>
									<div class="dark-matter-cost"><span id="aGiftFromGodCostLabel"></span>: <b id="aGiftFromGodCost"></b> <span class="color-dark-orbs"><span class="orb-text" id="aGiftFromGodCurrency"></span></span></div>
									<div id="aGiftFromGodProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="aGiftFromGodBuyButton" onclick="buyAGiftFromGod()"></button>
								</div>
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="gotta_be_fast"></div>
									<div class="dark-matter-desc"><span id="gottaBeFastDesc"></span></div>
									<div class="dark-matter-cost"><span id="gottaBeFastCostLabel"></span>: <b id="gottaBeFastCost"></b> <span class="color-dark-orbs"><span class="orb-text" id="gottaBeFastCurrency"></span></span></div>
									<div id="gottaBeFastProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="gottaBeFastBuyButton" onclick="buyGottaBeFast()"></button>
								</div>
								<div class="dark-matter-item">
									<div class="text-caption dark-matter-title" id="life_coach"></div>
									<div class="dark-matter-desc"><span id="lifeCoachDesc"></span></div>
									<div class="dark-matter-cost"><span id="lifeCoachCostLabel"></span>: <b id="lifeCoachCost"></b> <span class="color-dark-orbs"><span class="orb-text" id="lifeCoachCurrency"></span></span></div>
									<div id="lifeCoachProgress" class="req-progress-container">
										<div class="req-pending-bar color-dark-matter"></div>
										<div class="req-progress-bar color-dark-matter"></div>
									</div>
									<button class="button" id="lifeCoachBuyButton" onclick="buyLifeCoach()"></button>
								</div>
							</div>
						</div>
						<div id="skillTreeTab" class="tabDarkMatter">
							<div id="skillTreePage" class="panel page-column padded">
								<div id="skillTreePageDarkMaterDisplay" class="text-caption">
									<div class="text-caption"><span class="color-dark-matter"><span id="skillTreePageDarkMaterTitle"></span>:</span> <span id="darkMatterSkillsDisplay"></span></div>
								</div>
							<div class="dark-matter-item text-center">
								<div class="text-caption dark-matter-warning" id="abilities_warning"></div>
								<button class="button" id="resetAbilitiesButton" onclick="resetSkillTree()"></button>
							</div>
								{% for ability in darkMatterAbilities %}
									<div class="dark-matter-item">
										<div class="text-caption dark-matter-title" id="{{ ability.key }}"></div>
										<div class="dark-matter-desc">
											<button id="{{ ability.prefix }}1" class="button" onclick="buyAbility('{{ ability.key }}', 1)"></button> -
											<span id="{{ ability.prefix }}1Desc"></span>
										</div>
										<div class="darkMatterSkillOR"></div>
										<div class="dark-matter-desc">
											<button id="{{ ability.prefix }}2" class="button" onclick="buyAbility('{{ ability.key }}', 2)"></button> -
											<span id="{{ ability.prefix }}2Desc"></span>
										</div>
										<div id="{{ ability.prefix }}Cost" class="dark-matter-cost"><span id="{{ ability.prefix }}CurrencyLabel"></span>: <b id="{{ ability.prefix }}CostValue"></b> <span class="color-dark-matter" id="{{ ability.prefix }}CurrencyIcon"></span></div>
										<div id="{{ ability.prefix }}Progress" class="req-progress-container">
											<div class="req-pending-bar color-dark-matter"></div>
											<div class="req-progress-bar color-dark-matter"></div>
										</div>
									</div>
								{% endfor %}
							</div>
						</div>
					</div>
				</div>
