name: File size check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  file-size:
    name: Source file size ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check source file sizes
        run: python scripts/check_file_size.py

