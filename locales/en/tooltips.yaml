skill_life_essence_tooltip: Lengthen your lifespan through the means of magic. However, is this truly the immortality you have tried seeking for...?
skill_time_warping_tooltip: Bend space and time through forbidden techniques, speeding up your learning processes.
skill_astral_body_tooltip: Lengthen your lifespan drastically beyond comprehension by harnessing ethereal energy.
