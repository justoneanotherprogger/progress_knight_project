skill_dark_knowledge_tooltip: Sealed for a very long time, you utilize these forbidden texts for your own personal gain.
skill_soul_drain_tooltip: Drain the life force of those around you, extending your own lifespan at the cost of theirs.
skill_void_influence_tooltip: Tapping into the powers of the Void while combining them with evil grants you an unlimited potential.
skill_time_loop_tooltip: Mastery is achieved when 'telling time' becomes 'telling time what to do'.
skill_evil_incarnate_tooltip: You have became the very thing you swore to destroy.

