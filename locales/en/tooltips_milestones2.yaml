tt_milestone_mind_control_name: Control the Devil by making him give you even more
  Evil per second
tt_milestone_galactic_emperor_name: Commander of the Galactic Council grants you the
  privilege to automatically collect Essence from the nearby planets
tt_milestone_dark_matter_harvester_name: Harvest the universe to extract even more
  Dark Matter from it.
tt_milestone_a_dark_era_name: Start a new era of Dark Matter.
tt_milestone_dark_orbiter_name: Using some wizardry you can improve your Dark Orb
  generators massively.
tt_milestone_dark_matter_mining_name: Mine a huge amount of Dark Matter from each
  planet you visit.
tt_milestone_the_new_gold_name: Essence might become the new gold due to mass adoption.
tt_milestone_the_devil_inside_you_name: Shady deals with the Devil grant you a huge
  Evil bonus.
tt_milestone_strange_magic_name: A strange wizard offers you a few secret spells which
  might be useful.
tt_milestone_life_is_valueable_name: Time is limited... Even as the ruler of the universe.
tt_milestone_speed_speed_speed_name: You can affect the speed of the universe with
  your gigantic amount of Dark Matter.
tt_milestone_dark_matter_millionaire_name: This secret spell will help you reach your
  quest to become the first Dark Matter millionaire.
tt_milestone_the_new_dark_matter_name: Your amulet tears space and time through all
  multiverses. Welcome to Metaverse.
tt_milestone_strong_hope_name: Another Faint Hope buff?!
tt_milestone_ruler_of_the_metaverse_name: Now you are thinking with portals
tt_milestone_a_new_hope_name: No more of this Faint Hope nonsense!!!
tt_milestone_time_is_a_flat_circle_name: This is a world where nothing is solved.
  Someone once told me, time is a flat circle. Everything we’ve ever done or will
  do, we’re gonna do over and over and over again.
tt_milestone_the_end_is_near_name: We don't try to live forever
tt_milestone_the_end_name: There is always an end
