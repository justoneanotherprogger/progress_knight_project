# Tooltips (tooltips_properties.yaml) section auto-generated from EN source
item_homeless_tooltip: Sleep on the uncomfortable, filthy streets while almost freezing to death every night. It cannot get any worse than this.
item_tent_tooltip: A thin sheet of tattered cloth held up by a couple of feeble, wooden sticks. Horrible living conditions but at least you have a roof over your head.
item_wooden_hut_tooltip: Shabby logs and dirty hay glued together with horse manure. Much more sturdy than a tent, however, the stench isn't very pleasant.
item_cottage_tooltip: Structured with a timber frame and a thatched roof. Provides decent living conditions for a fair price.
item_house_tooltip: A building formed from stone bricks and sturdy timber, which contains a few rooms. Although quite expensive, it is a comfortable abode.
item_large_house_tooltip: Much larger than a regular house, which boasts even more rooms and multiple floors. The building is quite spacious but comes with a hefty price tag.
item_small_palace_tooltip: A very rich and meticulously built structure rimmed with fine metals such as silver. Extremely high expenses to maintain for a lavish lifestyle.
item_grand_palace_tooltip: A grand residence completely composed of gold and silver. Provides the utmost luxurious and comfortable living conditions possible for a ludicrous
  price.
item_town_ruler_tooltip: You rule your very own community in your small town, owning multiple establishments.
item_city_ruler_tooltip: As the highest ranking official, you manage and oversee everything that happens. While your pay is astronomical, so are your expenses.
item_nation_ruler_tooltip: You reign the whole nation. While your riches may be corrupted, everything you see belongs to you.
item_pocket_dimension_tooltip: A Dimension just for you that can be summoned at will. What happens there stays there.
item_void_realm_tooltip: Unknown how or when the Void realm came into existence, containing elements which don’t exist outside of its dimensional plane are now all to your
  disposal
item_void_universe_tooltip: Predating our own universe, the Void has an unlimited amount of space for your belongings, if you are willing to submit to it.
item_astral_realm_tooltip: Beneath personality and ego lays the source of our deep character, our personhood. Here are the psychic senses, our deep mind and emotions, symbols
  and inner reality.
item_galactic_throne_tooltip: You sit on your throne, overseeing the existence itself.
item_spaceship_tooltip: Your own personal cosmic house, able to travel anywhere in the universe at 99.99% of the speed of light.
item_planet_tooltip: A planet with the sole purpose of housing you and your family.
item_ringworld_tooltip: A construct with the mass of Jupiter and a surface area millions of times that of Earth, capable of housing trillions of humans and other animals including
  alien species. The expenses are literally astronomical due to the maintenance involved in keeping the structure stable and the inside area habitable, but the massive
  living space is worth it.
item_stellar_neighborhood_tooltip: A fully colonized network of stars and star systems spanning dozens of light years is ready for you to explore and call home.
item_galaxy_tooltip: You rule your very own galaxy the size of the Milky Way, with billions of planets organized into thousands of different states all under your control.
  While your power is astronomical, so are your responsibilities.
item_supercluster_tooltip: A cluster of galactic groups spanning hundreds of millions of light years across and containing thousands of galaxies is under your control.
item_galaxy_filament_tooltip: One of the largest known structures of the universe, containing dozens of superclusters and millions of galaxies.
tt_God's Blessings: God bless you!
item_observable_universe_tooltip: You did it! You finally rule the entire universe...or do you?
item_multiverse_tooltip: Universe is too small for you?!
item_quantum_world_tooltip: You try to find at least some place that is still beyond your control, but all in vain.
item_bootes_void_tooltip: The Great Nothing
