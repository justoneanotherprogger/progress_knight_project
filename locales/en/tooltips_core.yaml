# Tooltips (tooltips_core.yaml) section auto-generated from EN source
tt_Beggar: You break your back day and night for a couple of copper coins. Calloused hands, dust on your shoulders — and every evening feels like it might be your last.
tt_Farmer: You plow the fields and grow the crops. The pay is modest, but the work is honest.
tt_Fisherman: You haul various fish and sell them for a handful of coins. A calm, but poorly paid job.
tt_Miner: You descend into dark tunnels where a cave-in lurks at every step, mining ore you'll sell for a pittance.
tt_Blacksmith: You smelt ore and forge weapons for the military. A respectable trade that pays decently, even for a commoner.
tt_Merchant: You travel from town to town, selling your wares at a markup. The pay is decent, and there is far less toil and grime.
tt_Squire: You carry your knight's shield and sword, dreaming of one day wielding one of your own. The pay is meager, but the experience is invaluable.
tt_Footman: Put down your life to battle with enemy soldiers. A courageous, respectable job but you are still worthless in the grand scheme of things.
tt_Veteran footman: More experienced and useful than the average footman, take out the enemy forces in battle with your might. The pay is not that bad.
tt_Centenary: By proving your skills with a bow, you were appointed to lead a small group of archers to ambush your enemies from a distance.
tt_Knight: Slash and pierce through enemy soldiers with ease, while covered in steel from head to toe. A decently paying and very respectable job.
tt_Veteran Knight: Utilising your unmatched combat ability, slaugher enemies effortlessly. Most footmen in the military would never be able to acquire such a well
  paying job like this.
tt_Holy Knight: Obliterate squadrons of enemy soldiers in one go with extraordinary proficiency, while wielding a magically imbued blade. Such a feared unit on the
  battlefield is paid extremely well.
tt_Lieutenant General: Feared by nations, obliterate entire armies in a blink of an eye. Roughly every century, only one holy knight is worthy of receiving such an
  esteemed title.
