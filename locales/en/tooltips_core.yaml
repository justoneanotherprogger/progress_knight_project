# Tooltips (tooltips_core.yaml) section auto-generated from EN source
job_beggar_tooltip: You break your back day and night for a couple of copper coins. Calloused hands, dust on your shoulders — and every evening feels like it might be your last.
job_farmer_tooltip: You plow the fields and grow the crops. The pay is modest, but the work is honest.
job_fisherman_tooltip: You haul various fish and sell them for a handful of coins. A calm, but poorly paid job.
job_miner_tooltip: You descend into dark tunnels where a cave-in lurks at every step, mining ore you'll sell for a pittance.
job_blacksmith_tooltip: You smelt ore and forge weapons for the military. A respectable trade that pays decently, even for a commoner.
job_merchant_tooltip: You travel from town to town, selling your wares at a markup. The pay is decent, and there is far less toil and grime.
job_squire_tooltip: You carry your knight's shield and sword, dreaming of one day wielding one of your own. The pay is meager, but the experience is invaluable.
job_footman_tooltip: Put down your life to battle with enemy soldiers. A courageous, respectable job but you are still worthless in the grand scheme of things.
job_veteran_footman_tooltip: More experienced and useful than the average footman, take out the enemy forces in battle with your might. The pay is not that bad.
job_centenary_tooltip: By proving your skills with a bow, you were appointed to lead a small group of archers to ambush your enemies from a distance.
job_knight_tooltip: Slash and pierce through enemy soldiers with ease, while covered in steel from head to toe. A decently paying and very respectable job.
job_veteran_knight_tooltip: Utilising your unmatched combat ability, slaugher enemies effortlessly. Most footmen in the military would never be able to acquire such a well
  paying job like this.
job_holy_knight_tooltip: Obliterate squadrons of enemy soldiers in one go with extraordinary proficiency, while wielding a magically imbued blade. Such a feared unit on the
  battlefield is paid extremely well.
job_lieutenant_general_tooltip: Feared by nations, obliterate entire armies in a blink of an eye. Roughly every century, only one holy knight is worthy of receiving such an
  esteemed title.
