# Tooltips (tooltips_arcane.yaml) section auto-generated from EN source
tt_Student: Study the theory of mana and practice basic spells. There is minor pay to cover living costs; however, this is a necessary stage in becoming a mage.
tt_Apprentice Mage: Under the supervision of a skilled mage, perform basic spells against enemies in battle. Generous pay will be provided to cover living costs.
tt_Adept Mage: Turn the tides of battle through casting intermediate spells and mentor other apprentices. The pay for this particular job is extremely high.
tt_Master Wizard: Utilise advanced spells to ravage and destroy entire legions of enemy soldiers. Only a small percentage of mages deserve to attain this role and
  are rewarded with an insanely high pay.
tt_Archmage: Blessed with unparalleled talent, perform unbelievable feats with magic at will. It is said that an archmage has enough destructive power to wipe an
  empire off the map.
tt_Chronomancer: Specialize in harnessing temporal energies that alter the flow of time with supernatural divinations and otherwordly expertise.
tt_Chairman: Spend your days administrating the Mage Collegium and investigate the concepts of true immortality. The chairman receives ludicrous amounts of pay
  daily.
tt_Imperator: You wield an unlimited power, making you unstoppable. By ruling with an iron fist, everyone in the Arcane Association has to obey your commands.
tt_Corrupted: Corrupted by Void, you are slowly turning into a slave with no free will, just to serve the Void for the rest of eternity... Can you resist it, or will
  it consume you forever?
tt_Void Slave: Each day, you are succumbing to the Void more and more. Can you hold onto your humanity for a bit longer, or will you let the Void devour you?
tt_Void Fiend: You become an inquisitive yet putrid creature that siphons life from everything around you.
tt_Abyss Anomaly: Screaming into existence, you become a manifestation of the unknowable nothingness that lies beyond.
tt_Void Wraith: Damned soul... a shadow of your former self, lingering between realms and consumed by void... Can you ever find peace?
tt_Void Reaver: There are few who may tread the paths between worlds, these powers grant you an ability to generate fields of void energy that devour all living things.
tt_Void Lord: You gazed into the dark heart of the Void long enough to become one of the most powerful and feared beings. All lesser void creatures are at your command.
tt_Abyss God: Creator of the Void, a vast canvas of blackness and nothingness, in which the concept of its existence defies all logic. Nothing will escape you.
