# Tooltips (tooltips_arcane.yaml) section auto-generated from EN source
job_student_tooltip: Study the theory of mana and practice basic spells. There is minor pay to cover living costs; however, this is a necessary stage in becoming a mage.
job_apprentice_mage_tooltip: Under the supervision of a skilled mage, perform basic spells against enemies in battle. Generous pay will be provided to cover living costs.
job_adept_mage_tooltip: Turn the tides of battle through casting intermediate spells and mentor other apprentices. The pay for this particular job is extremely high.
job_master_wizard_tooltip: Utilise advanced spells to ravage and destroy entire legions of enemy soldiers. Only a small percentage of mages deserve to attain this role and
  are rewarded with an insanely high pay.
job_archmage_tooltip: Blessed with unparalleled talent, perform unbelievable feats with magic at will. It is said that an archmage has enough destructive power to wipe an
  empire off the map.
job_chronomancer_tooltip: Specialize in harnessing temporal energies that alter the flow of time with supernatural divinations and otherwordly expertise.
job_chairman_tooltip: Spend your days administrating the Mage Collegium and investigate the concepts of true immortality. The chairman receives ludicrous amounts of pay
  daily.
job_imperator_tooltip: You wield an unlimited power, making you unstoppable. By ruling with an iron fist, everyone in the Arcane Association has to obey your commands.
job_corrupted_tooltip: Corrupted by Void, you are slowly turning into a slave with no free will, just to serve the Void for the rest of eternity... Can you resist it, or will
  it consume you forever?
job_void_slave_tooltip: Each day, you are succumbing to the Void more and more. Can you hold onto your humanity for a bit longer, or will you let the Void devour you?
job_void_fiend_tooltip: You become an inquisitive yet putrid creature that siphons life from everything around you.
job_abyss_anomaly_tooltip: Screaming into existence, you become a manifestation of the unknowable nothingness that lies beyond.
job_void_wraith_tooltip: Damned soul... a shadow of your former self, lingering between realms and consumed by void... Can you ever find peace?
job_void_reaver_tooltip: There are few who may tread the paths between worlds, these powers grant you an ability to generate fields of void energy that devour all living things.
job_void_lord_tooltip: You gazed into the dark heart of the Void long enough to become one of the most powerful and feared beings. All lesser void creatures are at your command.
job_abyss_god_tooltip: Creator of the Void, a vast canvas of blackness and nothingness, in which the concept of its existence defies all logic. Nothing will escape you.
