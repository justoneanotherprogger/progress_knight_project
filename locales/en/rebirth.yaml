# Rebirth / Amulet tab
rebirth_note_0: You stumble across a strange looking amulet on your 25th birthday. It does not look like it has any worth on the market given that it is made from cheap-looking copper. However, you feel a weird urge to keep the amulet, so you slip it into your pocket for safekeeping.
rebirth_note_1: On your 45th birthday, you feel the amulet shiver uncontrollably in your pocket. You take it out and the constant shivering suddenly stops. More to your bizarre surprise, you notice a strange etching on the centre of the amulet.
rebirth_note_2: On your 65th birthday, you once again encounter the strange, unexplained shivering from your amulet. But this time, a living eyeball emerges from the centre. Although terribly frightened, you realise you do not have many years to live left anyway so you consider touching the eye to see what happens.
rebirth_note_2_info: "By touching the eyeball, you will be reborn and have to restart life again, losing all your levels and coins. However, you will gain <b>xp multipliers</b> for your heroes and skills equivalent to: <b>1 + the max level of the hero or skill / 10.</b> This means you will learn everything again much more quickly than you did in your previous life."
rebirth_note_2_hint: "Something tells you that the amulet might evolve after living for <b>2 whole centuries</b>..."
rebirth_note_3: "Your gut instinct was right. The moment you hit the grand age of 200, you hear an ominous hum coming from the amulet. A mouth emerges from its surface and begins to cackle, and proceeds to say: \"So you have made it this far... Are you ready to embrace evil?\""
rebirth_note_3_hint: "The amulet might transform even further after living for a <b>millennium</b>."
rebirth_note_3_info: "If you decide to embrace evil, all of your levels, coins and even max levels will be reset. You will be reborn as a fresh slate. However, you will unlock a new line of skills and gain <b><span id=\"evilGainDisplay\"></span> evil</b>, which will heavily impact your future lives."
rebirth_note_4: "A thousand years have come and gone and yet, you still remain alive... somehow. You feel your amulet shivering again and to your surprise, you see small tendrils full of eyeballs emergin from it. As you are about to drop the amulet, you hear frightening screech followed by whispers in your head... <b>\"You have to embrace the Void...\"</b>"
rebirth_note_4_hint: "The amulet will reach its final form after <b>ten millennia</b>!"
rebirth_note_4_unlock: "You have unlocked <b>\"The Void\"</b> class category along with <b>\"Void Manipulation\"</b> skills."
rebirth_note_5: "Ten millenia have passed... most of them spent serving the Void, yet there is still a glimpse of humanity inside of you. All of the sudden your amulet starts to glow in the distance, illuminating darkness around you with the brightness of a thousand suns. With the very last remnant of your free will, you run to your amulet and touch it... <b>\"You are now part of something bigger than yourself...\"</b>"
rebirth_note_5_unlock: "You have unlocked <b>\"Galactic Council\"</b> class category along with <b>\"Celestial Powers\"</b> skills."
rebirth_note_5_info: "If you decide to <b>transcend</b>, you will be reborn once again, losing all your coins, <b>evil</b> and current levels. However, your max levels won't be erased, but instead multiplied with the effect from the <b>Cosmic Recollection</b> skill and you will gain <b><span id=\"essenceGainDisplay\"></span> essence</b>, along with new skills that will boost you even further in your journey."
rebirth_note_5_warning: "Transcend will only appear if you have the <b>Cosmic Recollection</b> skill unlocked!"
rebirth_note_7: You are starting to become way too powerful. The end of the universe may be near...
rebirth_note_7_info: "If you decide to <b>collapse the universe</b>, all of your levels, coins, max levels, evil, and <b>essence</b> will be reset. You will be reborn as a fresh slate in a new universe, with no memory of milestones and challenges from any of your past selves. In exchange, you will unlock a third new line of skills and gain <b><span id=\"darkMatterGainDisplay\"></span> Dark Matter</b>, which will boost you much further in your journey across the multiverse."
rebirth_note_8: You have discovered the Metaverse!
rebirth_note_8_info: When you go to the Metaverse, you will lose everything that you have earned before. You will start from scratch, but over time you will become far superior.
hypercube_cap_text: "Your hypercubes cap will be increased to <span class=\"color-hypercubes\" id=\"hypercubeCapDisplay\"></span>."
perk_points_gain_text: "You will gain <span class=\"color-perk-points\"><span id=\"perkPointsGainDisplay\"></span> Metaverse perk points</span>."
