# Tooltips: Properties
tt_Homeless: Спите на неудобных грязных улицах, каждую ночь почти замерзая до смерти. Хуже уже не бывает.
tt_Tent: Тонкое полотно из лоскутов, держащееся на паре хлипких деревянных палок. Ужасные условия, но хотя бы крыша над головой.
tt_Wooden Hut: Брёвна и грязная солома, скреплённые лошадиным навозом. Гораздо прочнее палатки, вот только запах не из приятных.
tt_Cottage: Каркас из бруса и соломенная крыша. Неплохие условия по справедливой цене.
tt_House: Строение из каменных блоков и крепкого дерева с несколькими комнатами. Дороговато, зато уютное жильё.
tt_Large House: Гораздо больше обычного дома — больше комнат и несколько этажей. Просторно, но и цена соответствующая.
tt_Small Palace: Богатое, кропотливо возведённое здание, отделанное благородными металлами вроде серебра. Огромные расходы на роскошный образ жизни.
tt_Grand Palace: Величественная резиденция целиком из золота и серебра. Предельно роскошные и удобные условия — за безумную цену.
tt_Town Ruler: Вы правите собственным сообществом в своём маленьком городке, владея множеством заведений.
tt_City Ruler: Как высшее должностное лицо, вы управляете и следите за всем происходящим. Плата астрономическая, но и расходы такие же.
tt_Nation Ruler: Вы правите целой нацией. Пусть богатства ваши сомнительны, всё, что вы видите, принадлежит вам.
tt_Pocket Dimension: Измерение только для вас, вызываемое по желанию. Что там происходит, там и остаётся.
tt_Void Realm: Неизвестно, как и когда возникло царство Бездны; элементы, которых нет за его пределами, теперь в вашем распоряжении.
tt_Void Universe: Возникшая раньше нашей вселенной, Бездна дарит неограниченное пространство для ваших владений, если вы готовы ей покориться.
tt_Astral Realm: Под личностью и эго лежит источник нашей глубины, нашей самости. Здесь — психические чувства, глубинный ум и эмоции, символы и внутренняя реальность.
tt_Galactic Throne: Вы сидите на своём троне, наблюдая за самим существованием.
tt_Spaceship: Ваш личный космический дом, способный путешествовать в любую точку вселенной на 99,99% скорости света.
tt_Planet: Планета с единственной целью — служить жильём вам и вашей семье.
tt_Ringworld: Структура с массой Юпитера и поверхностью в миллионы раз больше земной, способная вместить триллионы людей и иных существ, включая инопланетные виды. Расходы поистине астрономические из-за поддержания стабильности и пригодности для жизни, но простор того стоит.
tt_Stellar Neighborhood: Полностью колонизированная сеть звёзд и звёздных систем протяжённостью в десятки световых лет готова к вашему освоению и жизни.
tt_Galaxy: Вы правите галактикой размером с Млечный Путь — миллиарды планет, объединённых в тысячи государств, всё под вашим контролем. Власть астрономическая, но и ответственность такая же.
tt_Supercluster: Под вашим контролем скопление галактических групп протяжённостью в сотни миллионов световых лет, вмещающее тысячи галактик.
tt_Galaxy Filament: Одна из крупнейших известных структур вселенной, вмещающая десятки сверхскоплений и миллионы галактик.
tt_Observable Universe: Получилось! Вы наконец правите всей вселенной... или нет?
tt_Multiverse: Вселенная для вас слишком мала?!
tt_Quantum World: Вы пытаетесь найти хоть один уголок, всё ещё не подвластный вам, но всё тщетно.
tt_Boötes Void: Великое Ничто