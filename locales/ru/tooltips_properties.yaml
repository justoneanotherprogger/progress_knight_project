# Tooltips: Properties
item_homeless_tooltip: Спите на неудобных грязных улицах, каждую ночь почти замерзая до смерти. Хуже уже не бывает.
item_tent_tooltip: Тонкое полотно из лоскутов, держащееся на паре хлипких деревянных палок. Ужасные условия, но хотя бы крыша над головой.
item_wooden_hut_tooltip: Брёвна и грязная солома, скреплённые лошадиным навозом. Гораздо прочнее палатки, вот только запах не из приятных.
item_cottage_tooltip: Каркас из бруса и соломенная крыша. Неплохие условия по справедливой цене.
item_house_tooltip: Строение из каменных блоков и крепкого дерева с несколькими комнатами. Дороговато, зато уютное жильё.
item_large_house_tooltip: Гораздо больше обычного дома — больше комнат и несколько этажей. Просторно, но и цена соответствующая.
item_small_palace_tooltip: Богатое, кропотливо возведённое здание, отделанное благородными металлами вроде серебра. Огромные расходы на роскошный образ жизни.
item_grand_palace_tooltip: Величественная резиденция целиком из золота и серебра. Предельно роскошные и удобные условия — за безумную цену.
item_town_ruler_tooltip: Вы правите собственным сообществом в своём маленьком городке, владея множеством заведений.
item_city_ruler_tooltip: Как высшее должностное лицо, вы управляете и следите за всем происходящим. Плата астрономическая, но и расходы такие же.
item_nation_ruler_tooltip: Вы правите целой нацией. Пусть богатства ваши сомнительны, всё, что вы видите, принадлежит вам.
item_pocket_dimension_tooltip: Измерение только для вас, вызываемое по желанию. Что там происходит, там и остаётся.
item_void_realm_tooltip: Неизвестно, как и когда возникло царство Бездны; элементы, которых нет за его пределами, теперь в вашем распоряжении.
item_void_universe_tooltip: Возникшая раньше нашей вселенной, Бездна дарит неограниченное пространство для ваших владений, если вы готовы ей покориться.
item_astral_realm_tooltip: Под личностью и эго лежит источник нашей глубины, нашей самости. Здесь — психические чувства, глубинный ум и эмоции, символы и внутренняя реальность.
item_galactic_throne_tooltip: Вы сидите на своём троне, наблюдая за самим существованием.
item_spaceship_tooltip: Ваш личный космический дом, способный путешествовать в любую точку вселенной на 99,99% скорости света.
item_planet_tooltip: Планета с единственной целью — служить жильём вам и вашей семье.
item_ringworld_tooltip: Структура с массой Юпитера и поверхностью в миллионы раз больше земной, способная вместить триллионы людей и иных существ, включая инопланетные виды. Расходы поистине астрономические из-за поддержания стабильности и пригодности для жизни, но простор того стоит.
item_stellar_neighborhood_tooltip: Полностью колонизированная сеть звёзд и звёздных систем протяжённостью в десятки световых лет готова к вашему освоению и жизни.
item_galaxy_tooltip: Вы правите галактикой размером с Млечный Путь — миллиарды планет, объединённых в тысячи государств, всё под вашим контролем. Власть астрономическая, но и ответственность такая же.
item_supercluster_tooltip: Под вашим контролем скопление галактических групп протяжённостью в сотни миллионов световых лет, вмещающее тысячи галактик.
item_galaxy_filament_tooltip: Одна из крупнейших известных структур вселенной, вмещающая десятки сверхскоплений и миллионы галактик.
item_observable_universe_tooltip: Получилось! Вы наконец правите всей вселенной... или нет?
item_multiverse_tooltip: Вселенная для вас слишком мала?!
item_quantum_world_tooltip: Вы пытаетесь найти хоть один уголок, всё ещё не подвластный вам, но всё тщетно.
item_bootes_void_tooltip: Великое Ничто