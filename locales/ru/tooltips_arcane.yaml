# Tooltips: The Arcane Association + The Void
tt_Student: Изучайте теорию маны и практикуйте базовые заклинания. Плата небольшая и едва покрывает расходы на жизнь, но это необходимый этап на пути в маги.
tt_Apprentice Mage: Под руководством умелого мага применяете в бою базовые заклинания. За это полагается щедрая плата на жизнь.
tt_Adept Mage: Средними заклинаниями переламываете ход битвы и наставляете других подмастерьев. Оплата этой работы крайне высока.
tt_Master Wizard: Продвинутыми заклинаниями опустошайте и уничтожайте целые легионы солдат противника. Лишь немногие маги достойны этой роли и бешеной платы.
tt_Archmage: Обладая несравненным талантом, творите магией невероятное по велению воли. Говорят, архимага достаточно, чтобы стереть империю с карты мира.
tt_Chronomancer: Специализируетесь на энергии времени, меняя его течение сверхъестественными предсказаниями и потусторонним знанием.
tt_Chairman: Дни напролёт руководите Коллегией магов и исследуете суть истинного бессмертия. Глава получает нелепо большое жалованье каждый день.
tt_Imperator: В ваших руках безграничная мощь, что делает вас неустрашимым. Правив железной рукой, вы добиваетесь подчинения всей Ассоциации своим приказом.
tt_Corrupted: Разъеденные Бездной, вы незаметно превращаетесь в раба без своей воли, лишь бы служить Бездне до скончания вечности... Сможете ли вы устоять, или она поглотит вас навсегда?
tt_Void Slave: С каждым днём вы всё сильнее подпадаете под влияние Бездны. Сможете ли вы ещё чуть дольше удержать человечность, или позволите Бездне поглотить себя?
tt_Void Fiend: Вы становитесь извращённой тварью, что вытягивает жизнь из всего вокруг.
tt_Abyss Anomaly: С воплем появляясь из небытия, вы становитесь олицетворением непознаваемой пустоты, что лежит за гранью.
tt_Void Wraith: Проклятая душа... тень вашего прошлого, застывшая между мирами и переполненная пустотой... Снищете ли вы когда-нибудь покой?
tt_Void Reaver: Немногие умеют ступать между мирами — эта сила позволяет вам порождать поля энергии Бездны, пожирающие всё живое.
tt_Void Lord: Вы достаточно долго смотрели во тьму Бездны, чтобы стать одним из могущественнейших и ужасающих существ. Все низшие создания Бездны — в вашей власти.
tt_Abyss God: Создатель пустоты, обширного полотна черноты и небытия, где сама идея его существования отрицает всякую логику. От вас никому не уйти.