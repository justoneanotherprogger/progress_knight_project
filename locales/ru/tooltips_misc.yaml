# Tooltips: Misc items
tt_Book: Место, куда можно записать все свои мысли и открытия, что позволяет учиться гораздо быстрее.
tt_Dumbbells: Тяжёлые снаряды для изнурительных тренировок — закаляют тело и быстрее накапливают силу.
tt_Personal Squire: Помогает справляться с повседневными делами, освобождая вам время для продуктивной работы.
tt_Steel Longsword: Прекрасный клинок, позволяющий быстрее расправляться с врагами в бою и получать больше опыта.
tt_Butler: Следит за чистотой вашего дома и готовит три вкусных блюда в день, делая вас счастливее и спокойнее.
tt_Sapphire Charm: Талисман с редким сапфиром активирует больше каналов маны в вашем теле, заметно облегчая изучение магии.
tt_Study Desk: Выделенное место с отличными письменными принадлежностями и оборудованием для продвижения в исследованиях.
tt_Library: Хранит множество книг, каждая из которых несёт огромный объём знаний — от житейских навыков до сложных заклинаний.
tt_Observatory: Служит для наблюдения за земными, морскими и небесными событиями.
tt_Mind's Eye: Позволяет видеть воспоминания, помнить образы и даже создавать новые картины и идеи.
tt_Void Necklace: Помогает формировать и управлять материей Бездны — вплоть до превращения её во что угодно.
tt_Void Armor: Врождённая броня как часть вашего тела, устойчивая к атакам, урону и боли.
tt_Void Blade: Выкованный из пыли Бездны и тёмной материи клинок способен пронзать барьеры измерений. Оружие выбора для каждого Рейдера Бездны.
tt_Void Orb: Коснувшись существ вне Бездны, сфера мгновенно распадает их, черпая силу из царства Бездны.
tt_Void Dust: Чистейший материал Бездны — чайная ложка пыли весит как небольшая планета.
tt_Celestial Robe: Самое мощное и незаменимое облачение небожителя. Служит источником бесконечной силы.
tt_Universe Fragment: Фрагмент из времени рождения вселенной. Способен создавать маленькие вселенные.
tt_Multiverse Fragment: Появившийся задолго до нашей вселенной, этот странный бесформенный предмет излучает бесконечную энергию.
tt_Stairway to heaven: Лестница к самим Всевышним.
tt_Highway to hell: Дьявол приглашает вас в свой дворец ужасов.
tt_Tesseract: Этот предмет прибыл из мира высших измерений.
tt_Desintegration: И зачем вам это?
tt_Custom Galaxy: Вы знаете о карманном измерении, верно?
tt_Hypersphere: Вы обретаете безграничную силу... а, вы уже всемогущий...