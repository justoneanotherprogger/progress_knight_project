# Tooltips: Skills (Fundamentals/Combat/Magic/Dark Magic)
tt_Concentration: Повышайте скорость обучения, практикуя интенсивную концентрацию.
tt_Productivity: Приучайтесь меньше прокрастинировать на работе и получать больше опыта в день.
tt_Bargaining: Изучайте хитрости ремесла и искусство убеждения, чтобы снижать любые расходы.
tt_Meditation: Наполняйте разум покоем и безмятежностью, чтобы раскрыть в себе больше счастья.
tt_Strength: Укрепляйте тело и силу суровыми тренировками. Более крепких в военной службе оплачивают лучше.
tt_Battle Tactics: Разрабатывайте и обновляйте стратегии боя, получая больше опыта в военной службе.
tt_Muscle Memory: Привычкой и повторением укрепляйте нейроны, увеличивая прирост силы по всему телу.
tt_Mana Control: Усиливайте свои каналы маны по всему телу, становясь более могущественным пользователем магии.
tt_Life Essence: С помощью магии продлевайте свою жизнь. Но так ли то бессмертие, к которому вы стремились...?
tt_Time Warping: Запретными техниками гните пространство и время, ускоряя свои процессы обучения.
tt_Astral Body: Черпая эфирную энергию, радикально продлевайте свою жизнь за пределами понимания.
tt_Temporal Dimension: Создайте собственное карманное измерение, где столетия проносятся за считанные секунды.
tt_All Seeing Eye: На высшей должности Коллегии магов все средства поступают напрямую вам.
tt_Brainwashing: Техника, созданная для управления мыслями и поступками человека против его воли.

# Dark Magic - Evil Required
tt_Dark Influence: Окутайте себя внушительной силой, дарованной злом, и легко осваивайте любую работу или навык.
tt_Evil Control: Укрощайте бурлящее и растущее зло внутри себя, увеличивая получение зла между перерождениями.
tt_Intimidation: Научитесь излучать дьявольскую ауру, что внушает страх другим торговцам и вынуждает их давать вам большие скидки.
tt_Demon Training: Человеческое тело слишком слабо, чтобы вынести зло. Тренируясь запретными методами, медленно превращаетесь в демона, быстро поглощающего знания.
tt_Blood Meditation: Питаете и растите зло в себе, принося в жертву живые существа, резко увеличивая прирост зла.
tt_Demon's Wealth: С помощью тёмной магии умножаете материю монет, получаемых за работу.
tt_Dark Knowledge: Запертые надолго запретные свитки вы используете ради личной выгоды.
tt_Void Influence: Обращение к силам Бездны в сочетании со злом открывает вам безграничный потенциал.
tt_Time Loop: Мастерство приходит, когда «говорить время» превращается в «приказывать времени, что делать».
tt_Evil Incarnate: Вы стали тем самым врагом, что поклялись уничтожить.