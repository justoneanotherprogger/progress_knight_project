# Tooltips: Skills (Fundamentals/Combat/Magic/Dark Magic)
tt_Concentration: Вы повышаете скорость обучения интенсивными упражнениями на концентрацию.
tt_Productivity: День за днём вы всё реже откладываете дела на потом — привычка работать крепнет, а с ней растёт и дневной опыт.
tt_Bargaining: Вы постигаете уловки торгового дела и учитесь убеждать — умелый торг сбивает любые расходы.
tt_Meditation: Вы наполняете разум покоем и безмятежностью, раскрывая в себе больше счастья.
tt_Strength: Вы закаляете тело суровыми тренировками. Армия ценит крепких солдат — и платит им больше.
tt_Battle Tactics: Вы разрабатываете и оттачиваете боевые стратегии — и опыт на военном поприще растёт с каждым боем.
tt_Muscle Memory: Привычкой и повторением вы укрепляете нейроны, увеличивая прирост силы по всему телу.
tt_Mana Control: Вы усиливаете свои каналы маны по всему телу, становясь более могущественным магом.
tt_Life Essence: Вы продлеваете жизнь силой магии. Но то ли это бессмертие, к которому вы стремились...?
tt_Time Warping: Запретными техниками вы гнёте пространство и время, ускоряя свои процессы обучения.
tt_Astral Body: Черпая эфирную энергию, вы продлеваете свою жизнь за грань понимания.
tt_Temporal Dimension: Вы создаёте собственное карманное измерение, где столетия проносятся за считанные секунды.
tt_All Seeing Eye: Ваше всевидящее око следит за каждым золотым Коллегии магов — и чем выше ваша должность, тем больше монет находит дорогу в ваш карман.
tt_Brainwashing: Вы берёте чужую волю в свои руки и поворачиваете её против самого человека — он исполняет ваши желания, искренне веря, что это его собственные.

# Dark Magic - Evil Required
tt_Dark Influence: Вы окутываете себя внушительной силой, дарованной злом, и всё лучше осваиваете любую работу или навык.
tt_Evil Control: Вы укрощаете бурлящее и растущее зло внутри себя, увеличивая получение зла между перерождениями.
tt_Intimidation: Вы учитесь излучать дьявольскую ауру, что внушает купцам первобытный ужас и заставляет их давать вам большие скидки.
tt_Demon Training: Человеческое тело слишком слабо, чтобы вместить зло. Вы тренируетесь запретными методами и медленно превращаетесь в демона, быстро впитывающего знания.
tt_Blood Meditation: Тьма в вас просыпается с каждой жертвой — обряд за обрядом вы вскармливаете зло чужими жизнями, и оно становится всё ненасытнее.
tt_Demon's Wealth: Тёмная магия всё послушнее вашей воле — материя заработанных трудом монет умножается, и кошелёк тяжелеет день ото дня.
tt_Dark Knowledge: Вы всё глубже постигаете запретные тексты — тайны, веками запертые под печатью, день ото дня становятся вашими.
tt_Void Influence: Вы всё глубже черпаете силы Бездны, сплетая их со злом в себе, — и предела этой мощи не видно.
tt_Time Loop: Вы всё реже спрашиваете у времени, который час, — и всё чаще говорите ему, который час настанет.
tt_Evil Incarnate: Вы становитесь тем злом, которое поклялись уничтожить — тьма прорастает в вас всё глубже, и всё, чему вы учитесь, даётся вам легче и быстрее.