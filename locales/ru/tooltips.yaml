# Tooltips: Common work + Military
job_beggar_tooltip: Гнёте спину день и ночь ради пары медных монет. Руки в мозолях, плечи в пыли — и каждый вечер кажется, что это был последний.
job_farmer_tooltip: Вы пашете поля и растите урожай. Плата скромная, зато труд честный.
job_fisherman_tooltip: Вы таскаете разную рыбу и продаёте её за горсть монет. Спокойная, но всё же малооплачиваемая работа.
job_miner_tooltip: Вы спускаетесь в тёмные штольни, где обвал подстерегает на каждом шагу, чтобы добыть руду, которую продадите за гроши.
job_blacksmith_tooltip: Вы плавите руду и куёте оружие для армии. Уважаемое ремесло, за которое прилично платят — даже простолюдину.
job_merchant_tooltip: Вы разъезжаете из города в город, сбывая товар подороже. Плата приличная, а грязи и мозолей куда меньше.
job_squire_tooltip: Вы носите щит и меч своего рыцаря, мечтая однажды взять в руки собственный. Жалованье скудное, но опыт бесценен.
job_footman_tooltip: Отдадите жизнь в бою с вражескими солдатами. Мужественная работа, но вы всё ещё пыль в общей картине.
job_veteran_footman_tooltip: Вы опытнее и полезнее обычного пехотинца, своей мощью выбиваете врага. Плата неплохая.
job_centenary_tooltip: Доказав мастерство лучника, вас назначили вести небольшую группу стрелков для засад.
job_knight_tooltip: Вы косите и пробиваете вражеских солдат насквозь, закованный в сталь с ног до головы. Достойно оплачиваемая и уважаемая работа.
job_veteran_knight_tooltip: Благодаря непревзойдённому боевому умению вы с лёгкостью сносите врагов. Большинство пехотинцев никогда не получит такую оплату.
job_holy_knight_tooltip: Одним махом вы истребляете целые отряды врагов, взяв волшебное лезвие. Столь страшная единица на поле боя получает огромную плату.
job_lieutenant_general_tooltip: Страшный для наций, вы стираете целые армии в одно мгновение. Ровно раз в столетие один святой рыцарь удостаивается этого звания.

# Tooltips: Skills (Fundamentals/Combat/Magic/Dark Magic)
skill_concentration_tooltip: Вы повышаете скорость обучения интенсивными упражнениями на концентрацию.
skill_productivity_tooltip: День за днём вы всё реже откладываете дела на потом — привычка работать крепнет, а с ней растёт и дневной опыт.
skill_bargaining_tooltip: Вы постигаете уловки торгового дела и учитесь убеждать — умелый торг сбивает любые расходы.
skill_meditation_tooltip: Вы наполняете разум покоем и безмятежностью, раскрывая в себе больше счастья.
skill_strength_tooltip: Вы закаляете тело суровыми тренировками. Армия ценит крепких солдат — и платит им больше.
skill_battle_tactics_tooltip: Вы разрабатываете и оттачиваете боевые стратегии — и опыт на военном поприще растёт с каждым боем.
skill_muscle_memory_tooltip: Привычкой и повторением вы укрепляете нейроны, увеличивая прирост силы по всему телу.
skill_mana_control_tooltip: Вы усиливаете свои каналы маны по всему телу, становясь более могущественным магом.
skill_life_essence_tooltip: Вы продлеваете жизнь силой магии. Но то ли это бессмертие, к которому вы стремились...?
skill_time_warping_tooltip: Запретными техниками вы гнёте пространство и время, ускоряя свои процессы обучения.
skill_astral_body_tooltip: Черпая эфирную энергию, вы продлеваете свою жизнь за грань понимания.
skill_temporal_dimension_tooltip: Вы создаёте собственное карманное измерение, где столетия проносятся за считанные секунды.
skill_all_seeing_eye_tooltip: Ваше всевидящее око следит за каждым золотым Коллегии магов — и чем выше ваша должность, тем больше монет находит дорогу в ваш карман.
skill_brainwashing_tooltip: Вы берёте чужую волю в свои руки и поворачиваете её против самого человека — он исполняет ваши желания, искренне веря, что это его собственные.

# Dark Magic - Evil Required
skill_dark_influence_tooltip: Вы окутываете себя внушительной силой, дарованной злом, и всё лучше осваиваете любую работу или навык.
skill_evil_control_tooltip: Вы укрощаете бурлящее и растущее зло внутри себя, увеличивая получение зла между перерождениями.
skill_intimidation_tooltip: Вы учитесь излучать дьявольскую ауру, что внушает купцам первобытный ужас и заставляет их давать вам большие скидки.
skill_demon_training_tooltip: Человеческое тело слишком слабо, чтобы вместить зло. Вы тренируетесь запретными методами и медленно превращаетесь в демона, быстро впитывающего знания.
skill_blood_meditation_tooltip: Тьма в вас просыпается с каждой жертвой — обряд за обрядом вы вскармливаете зло чужими жизнями, и оно становится всё ненасытнее.
skill_demons_wealth_tooltip: Тёмная магия всё послушнее вашей воле — материя заработанных трудом монет умножается, и кошелёк тяжелеет день ото дня.
skill_dark_knowledge_tooltip: Вы всё глубже постигаете запретные тексты — тайны, веками запертые под печатью, день ото дня становятся вашими.
skill_soul_drain_tooltip: Вы вытягиваете жизненную силу из окружающих — собственная жизнь удлиняется, но за каждую секунду вашего здоровья кто-то платит своей.
skill_void_influence_tooltip: Вы всё глубже черпаете силы Бездны, сплетая их со злом в себе, — и предела этой мощи не видно.
skill_time_loop_tooltip: Вы всё реже спрашиваете у времени, который час, — и всё чаще говорите ему, который час настанет.
skill_evil_incarnate_tooltip: Вы становитесь тем злом, которое поклялись уничтожить — тьма прорастает в вас всё глубже, и всё, чему вы учитесь, даётся вам легче и быстрее.

# Tooltips: Skills (Void Manipulation/Celestial Powers/Almightiness/Darkness)
skill_absolute_wish_tooltip: Способность исполнять решительно любые желания без каких-либо ограничений.
skill_void_amplification_tooltip: Вы отдаёте себя Бездне, отчего ей становится проще взять вас под контроль.
skill_mind_release_tooltip: В трансе вы ощущаете, как Бездна усиливает ваши мысли, восприятие, воспоминания, эмоции и личность.
skill_ceaseless_abyss_tooltip: Бесконечная пытка — вы поклялись служить Бездне до конца существования.
skill_void_symbiosis_tooltip: Симбиотическая связь, помогающая вам стать с Бездной единым целым.
skill_void_embodiment_tooltip: Если долго смотреть в бездну, бездна начнёт смотреть в вас.
skill_abyss_manipulation_tooltip: Позволяет формировать собственную реальность внутри самой Бездны.
skill_cosmic_longevity_tooltip: Вы видели всё — от самого начала до самого конца.
skill_cosmic_recollection_tooltip: Умение существовать в множестве параллельных временных линий и управлять своими двойниками, влияя на их судьбы по своему усмотрению.
skill_essence_collector_tooltip: Вы обращаете безграничный потенциал энергий мультивселенной в свою пользу и собираете её ресурсы.
skill_galactic_command_tooltip: Абсолютная власть развращает абсолютно.
skill_yin_yang_tooltip: Рождённый из хаоса при создании вселенной, он, как считается, существует в гармонии, уравновешивая зло и добро.
skill_parallel_universe_tooltip: Самодостаточный план бытия, сосуществующий с вашим собственным и помогающий восстановить фрагменты забытой силы.
skill_higher_dimensions_tooltip: Сила частично менять законы физики и выход за пределы низших измерений делают ваше существование бесконечным.
skill_epiphany_tooltip: Вы становитесь едины со всем сущим.
skill_dark_prince_tooltip: Вы можете пугающе быстро наращивать свой интеллект благодаря доступу ко всем библиотекам вселенной.
skill_dark_ruler_tooltip: Правя вселенной, вы собираете больше тёмной материи со своих подчинённых.
skill_immortal_ruler_tooltip: У вас лишь одна цель — править вселенной до бесконечности.
skill_dark_magician_tooltip: Запретной магией над подчинёнными вы выжимаете из них каждую каплю эссенции.
skill_universal_ruler_tooltip: Правив железной рукой, вы добиваетесь, чтобы никто не смел оспорить вашу власть.
skill_blinded_by_darkness_tooltip: Ослеплённый тьмой, вы больше не властны над собой. Вы начинаете крушить всё сущее, чтобы успокоиться.

# Tooltips: The Arcane Association + The Void
job_student_tooltip: Вы изучаете теорию маны и практикуете базовые заклинания. Плата небольшая и едва покрывает расходы на жизнь, но это необходимый этап на пути в маги.
job_apprentice_mage_tooltip: Под руководством умелого мага применяете в бою базовые заклинания. За это полагается щедрая плата на жизнь.
job_adept_mage_tooltip: Средними заклинаниями переламываете ход битвы и наставляете других подмастерьев. Оплата этой работы крайне высока.
job_master_wizard_tooltip: Продвинутыми заклинаниями вы опустошаете и уничтожаете целые легионы солдат противника. Лишь немногие маги достойны этой роли и бешеной платы.
job_archmage_tooltip: Обладая несравненным талантом, творите магией невероятное по велению воли. Говорят, архимага достаточно, чтобы стереть империю с карты мира.
job_chronomancer_tooltip: Специализируетесь на энергии времени, меняя его течение сверхъестественными предсказаниями и потусторонним знанием.
job_chairman_tooltip: Дни напролёт руководите Коллегией магов и исследуете суть истинного бессмертия. Глава получает нелепо большое жалованье каждый день.
job_imperator_tooltip: В ваших руках безграничная мощь, что делает вас неустрашимым. Правив железной рукой, вы добиваетесь подчинения всей Ассоциации своим приказом.
job_corrupted_tooltip: Разъеденные Бездной, вы незаметно превращаетесь в раба без своей воли, лишь бы служить Бездне до скончания вечности... Сможете ли вы устоять, или она поглотит вас навсегда?
job_void_slave_tooltip: С каждым днём вы всё сильнее подпадаете под влияние Бездны. Сможете ли вы ещё чуть дольше удержать человечность, или позволите Бездне поглотить себя?
job_void_fiend_tooltip: Вы становитесь извращённой тварью, что вытягивает жизнь из всего вокруг.
job_abyss_anomaly_tooltip: С воплем появляясь из небытия, вы становитесь олицетворением непознаваемой пустоты, что лежит за гранью.
job_void_wraith_tooltip: Проклятая душа... тень вашего прошлого, застывшая между мирами и переполненная пустотой... Снищете ли вы когда-нибудь покой?
job_void_reaver_tooltip: Немногие умеют ступать между мирами — эта сила позволяет вам порождать поля энергии Бездны, пожирающие всё живое.
job_void_lord_tooltip: Вы достаточно долго смотрели во тьму Бездны, чтобы стать одним из могущественнейших и ужасающих существ. Все низшие создания Бездны — в вашей власти.
job_abyss_god_tooltip: Создатель пустоты, обширного полотна черноты и небытия, где сама идея его существования отрицает всякую логику. От вас никому не уйти.

# Tooltips: Galactic Council + Metaverse Guards
job_eternal_wanderer_tooltip: С силами, дарованными неведомой сущностью, вы скитаетесь по местам, что одни почитают, а другие боятся, в поисках ответов.
job_nova_tooltip: Чрезвычайно могучее существо с колоссальными телекинетическими силами и способностью перестраивать молекулярную структуру материи и энергии вплоть до космического масштаба.
job_sigma_proioxis_tooltip: Почти всемогущая космологическая сущность с огромными способностями к манипуляции материей и энергией, что помогает вам раздвинуть пределы самой Вселенной.
job_acallaris_tooltip: Первозданное существо, появившееся раньше вселенной, причастное к созданию жизни и могущественное за гранью смертного понимания; для древнейших видов вселенной вы — миф.
job_one_above_all_tooltip: Создатель всего сущего.
job_snow_crash_tooltip: Лавина, 1992
job_player_one_tooltip: «Первому игроку приготовиться», 2011
job_lost_in_the_dark_tooltip: Они оба знали, что смогут двигаться вперёд лишь рядом друг с другом. Они поклялись всегда быть вместе, заработать много денег и перебраться в место лучше, где им будет очень хорошо.
job_omega_tooltip: ω

# Tooltips: Properties
item_homeless_tooltip: Спите на неудобных грязных улицах, каждую ночь почти замерзая до смерти. Хуже уже не бывает.
item_tent_tooltip: Тонкое полотно из лоскутов, держащееся на паре хлипких деревянных палок. Ужасные условия, но хотя бы крыша над головой.
item_wooden_hut_tooltip: Брёвна и грязная солома, скреплённые лошадиным навозом. Гораздо прочнее палатки, вот только запах не из приятных.
item_cottage_tooltip: Каркас из бруса и соломенная крыша. Неплохие условия по справедливой цене.
item_house_tooltip: Строение из каменных блоков и крепкого дерева с несколькими комнатами. Дороговато, зато уютное жильё.
item_large_house_tooltip: Гораздо больше обычного дома — больше комнат и несколько этажей. Просторно, но и цена соответствующая.
item_small_palace_tooltip: Богатое, кропотливо возведённое здание, отделанное благородными металлами вроде серебра. Огромные расходы на роскошный образ жизни.
item_grand_palace_tooltip: Величественная резиденция целиком из золота и серебра. Предельно роскошные и удобные условия — за безумную цену.
item_town_ruler_tooltip: Вы правите собственным сообществом в своём маленьком городке, владея множеством заведений.
item_city_ruler_tooltip: Как высшее должностное лицо, вы управляете и следите за всем происходящим. Плата астрономическая, но и расходы такие же.
item_nation_ruler_tooltip: Вы правите целой нацией. Пусть богатства ваши сомнительны, всё, что вы видите, принадлежит вам.
item_pocket_dimension_tooltip: Измерение только для вас, вызываемое по желанию. Что там происходит, там и остаётся.
item_void_realm_tooltip: Неизвестно, как и когда возникло царство Бездны; элементы, которых нет за его пределами, теперь в вашем распоряжении.
item_void_universe_tooltip: Возникшая раньше нашей вселенной, Бездна дарит неограниченное пространство для ваших владений, если вы готовы ей покориться.
item_astral_realm_tooltip: Под личностью и эго лежит источник нашей глубины, нашей самости. Здесь — психические чувства, глубинный ум и эмоции, символы и внутренняя реальность.
item_galactic_throne_tooltip: Вы сидите на своём троне, наблюдая за самим существованием.
item_spaceship_tooltip: Ваш личный космический дом, способный путешествовать в любую точку вселенной на 99,99% скорости света.
item_planet_tooltip: Планета с единственной целью — служить жильём вам и вашей семье.
item_ringworld_tooltip: Структура с массой Юпитера и поверхностью в миллионы раз больше земной, способная вместить триллионы людей и иных существ, включая инопланетные виды. Расходы поистине астрономические из-за поддержания стабильности и пригодности для жизни, но простор того стоит.
item_stellar_neighborhood_tooltip: Полностью колонизированная сеть звёзд и звёздных систем протяжённостью в десятки световых лет готова к вашему освоению и жизни.
item_galaxy_tooltip: Вы правите галактикой размером с Млечный Путь — миллиарды планет, объединённых в тысячи государств, всё под вашим контролем. Власть астрономическая, но и ответственность такая же.
item_supercluster_tooltip: Под вашим контролем скопление галактических групп протяжённостью в сотни миллионов световых лет, вмещающее тысячи галактик.
item_galaxy_filament_tooltip: Одна из крупнейших известных структур вселенной, вмещающая десятки сверхскоплений и миллионы галактик.
item_observable_universe_tooltip: Получилось! Вы наконец правите всей вселенной... или нет?
item_multiverse_tooltip: Вселенная для вас слишком мала?!
item_quantum_world_tooltip: Вы пытаетесь найти хоть один уголок, всё ещё не подвластный вам, но всё тщетно.
item_bootes_void_tooltip: Великое Ничто

# Tooltips: Misc items
item_book_tooltip: Место, куда можно записать все свои мысли и открытия, что позволяет учиться гораздо быстрее.
item_dumbbells_tooltip: Тяжёлые снаряды для изнурительных тренировок — закаляют тело и быстрее накапливают силу.
item_personal_squire_tooltip: Помогает справляться с повседневными делами, освобождая вам время для продуктивной работы.
item_steel_longsword_tooltip: Прекрасный клинок, позволяющий быстрее расправляться с врагами в бою и получать больше опыта.
item_butler_tooltip: Следит за чистотой вашего дома и готовит три вкусных блюда в день, делая вас счастливее и спокойнее.
item_sapphire_charm_tooltip: Талисман с редким сапфиром активирует больше каналов маны в вашем теле, заметно облегчая изучение магии.
item_study_desk_tooltip: Выделенное место с отличными письменными принадлежностями и оборудованием для продвижения в исследованиях.
item_library_tooltip: Хранит множество книг, каждая из которых несёт огромный объём знаний — от житейских навыков до сложных заклинаний.
item_observatory_tooltip: Служит для наблюдения за земными, морскими и небесными событиями.
item_minds_eye_tooltip: Позволяет видеть воспоминания, помнить образы и даже создавать новые картины и идеи.
item_void_necklace_tooltip: Помогает формировать и управлять материей Бездны — вплоть до превращения её во что угодно.
item_void_armor_tooltip: Врождённая броня как часть вашего тела, устойчивая к атакам, урону и боли.
item_void_blade_tooltip: Выкованный из пыли Бездны и тёмной материи клинок способен пронзать барьеры измерений. Оружие выбора для каждого Рейдера Бездны.
