# Tooltips: Common work + Military
tt_Beggar: Гнёте спину день и ночь ради пары медных монет. Руки в мозолях, плечи в пыли — и каждый вечер кажется, что это был последний.
tt_Farmer: Вы пашете поля и растите урожай. Плата скромная, зато труд честный.
tt_Fisherman: Вы таскаете разную рыбу и продаёте её за горсть монет. Спокойная, но всё же малооплачиваемая работа.
tt_Miner: Вы спускаетесь в тёмные штольни, где обвал подстерегает на каждом шагу, чтобы добыть руду, которую продадите за гроши.
tt_Blacksmith: Вы плавите руду и куёте оружие для армии. Уважаемое ремесло, за которое прилично платят — даже простолюдину.
tt_Merchant: Вы разъезжаете из города в город, сбывая товар подороже. Плата приличная, а грязи и мозолей куда меньше.
tt_Squire: Вы носите щит и меч своего рыцаря, мечтая однажды взять в руки собственный. Жалованье скудное, но опыт бесценен.
tt_Footman: Отдадите жизнь в бою с вражескими солдатами. Мужественная работа, но вы всё ещё пыль в общей картине.
tt_Veteran footman: Вы опытнее и полезнее обычного пехотинца, своей мощью выбиваете врага. Плата неплохая.
tt_Centenary: Доказав мастерство лучника, вас назначили вести небольшую группу стрелков для засад.
tt_Knight: Вы косите и пробиваете вражеских солдат насквозь, закованный в сталь с ног до головы. Достойно оплачиваемая и уважаемая работа.
tt_Veteran Knight: Благодаря непревзойдённому боевому умению вы с лёгкостью сносите врагов. Большинство пехотинцев никогда не получит такую оплату.
tt_Holy Knight: Одним махом вы истребляете целые отряды врагов, взяв волшебное лезвие. Столь страшная единица на поле боя получает огромную плату.
tt_Lieutenant General: Страшный для наций, вы стираете целые армии в одно мгновение. Ровно раз в столетие один святой рыцарь удостаивается этого звания.