# Tooltips: Common work + Military
tt_Beggar: Боретесь день и ночь ради пары медных монет. Каждый день вы словно на грани смерти.
tt_Farmer: Вспахивайте поля и растите урожай. Немного, но зато честный труд.
tt_Fisherman: Таскайте разную рыбу и продавайте её за горсть монет. Спокойная, но всё же малооплачиваемая работа.
tt_Miner: Спускайтесь в опасные пещеры и добывайте ценные руды. Плата ничтожна по сравнению с риском.
tt_Blacksmith: Плавите руду и тщательно куйте оружие для армии. Уважаемая и прилично оплачиваемая работа простолюдина.
tt_Merchant: Разъезжайте из города в город, торгуя добротным товаром. Плата приличная, а ручной работы гораздо меньше.
tt_Squire: Носите щит и меч своего рыцаря по полю боя. Жалованье скудное, но опыт бесценен.
tt_Footman: Отдадите жизнь в бою с вражескими солдатами. Мужественная работа, но вы всё ещё пыль в общей картине.
tt_Veteran footman: Вы опытнее и полезнее обычного пехотинца, своей мощью выбиваете врага. Плата неплохая.
tt_Centenary: Доказав мастерство лучника, вас назначили вести небольшую группу стрелков для засад.
tt_Knight: Косите и пробивай вражеских солдат насквозь, закованный в сталь с ног до головы. Достойно оплачиваемая и уважаемая работа.
tt_Veteran Knight: Благодаря непревзойдённому боевому умению вы с лёгкостью сносите врагов. Большинство пехотинцев никогда не получит такую оплату.
tt_Holy Knight: Одним махом вы истребляете целые отряды врагов, взяв волшебное лезвие. Столь страшная единица на поле боя получает огромную плату.
tt_Lieutenant General: Страшный для наций, вы стираете целые армии в одно мгновение. Ровно раз в столетие один святой рыцарь удостаивается этого звания.