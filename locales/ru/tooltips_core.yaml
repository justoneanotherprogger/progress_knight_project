# Tooltips: Common work + Military
job_beggar_tooltip: Гнёте спину день и ночь ради пары медных монет. Руки в мозолях, плечи в пыли — и каждый вечер кажется, что это был последний.
job_farmer_tooltip: Вы пашете поля и растите урожай. Плата скромная, зато труд честный.
job_fisherman_tooltip: Вы таскаете разную рыбу и продаёте её за горсть монет. Спокойная, но всё же малооплачиваемая работа.
job_miner_tooltip: Вы спускаетесь в тёмные штольни, где обвал подстерегает на каждом шагу, чтобы добыть руду, которую продадите за гроши.
job_blacksmith_tooltip: Вы плавите руду и куёте оружие для армии. Уважаемое ремесло, за которое прилично платят — даже простолюдину.
job_merchant_tooltip: Вы разъезжаете из города в город, сбывая товар подороже. Плата приличная, а грязи и мозолей куда меньше.
job_squire_tooltip: Вы носите щит и меч своего рыцаря, мечтая однажды взять в руки собственный. Жалованье скудное, но опыт бесценен.
job_footman_tooltip: Отдадите жизнь в бою с вражескими солдатами. Мужественная работа, но вы всё ещё пыль в общей картине.
job_veteran_footman_tooltip: Вы опытнее и полезнее обычного пехотинца, своей мощью выбиваете врага. Плата неплохая.
job_centenary_tooltip: Доказав мастерство лучника, вас назначили вести небольшую группу стрелков для засад.
job_knight_tooltip: Вы косите и пробиваете вражеских солдат насквозь, закованный в сталь с ног до головы. Достойно оплачиваемая и уважаемая работа.
job_veteran_knight_tooltip: Благодаря непревзойдённому боевому умению вы с лёгкостью сносите врагов. Большинство пехотинцев никогда не получит такую оплату.
job_holy_knight_tooltip: Одним махом вы истребляете целые отряды врагов, взяв волшебное лезвие. Столь страшная единица на поле боя получает огромную плату.
job_lieutenant_general_tooltip: Страшный для наций, вы стираете целые армии в одно мгновение. Ровно раз в столетие один святой рыцарь удостаивается этого звания.