# Rebirth / Amulet tab
rebirth_note_0: На своём 25-м дне рождения вы натыкаетесь на странный амулет. Он вряд ли дорого стоит на рынке — ведь сделан из дешёвой меди. Однако вы чувствуете странное желание сохранить амулет, поэтому кладёте его в карман.
rebirth_note_1: На вашем 45-м дне рождения вы чувствуете, как амулет неудержимо дрожит в кармане. Вы достаёте его, и постоянная дрожь внезапно прекращается. К вашему удивлению, вы замечаете странную гравировку в центре амулета.
rebirth_note_2: На вашем 65-м дне рождения вы снова сталкиваетесь с необъяснимой дрожью амулета. Но на этот раз из центра появляется живой глаз. Хотя вы ужасно напуганы, вы понимаете, что вам осталось жить немного, и решаете прикоснуться к глазу.
rebirth_note_2_info: 'Прикоснувшись к глазу, вы переродитесь и начнёте жизнь заново, потеряв все уровни и монеты. Однако вы получите <b>множители опыта</b> для героев и навыков: <b>1 + максимальный уровень героя или навыка / 10.</b> Это означает, что вы будете учиться намного быстрее.'
rebirth_note_2_hint: 'Что-то подсказывает, что амулет может эволюционировать после проживания <b>2 целых веков</b>...'
rebirth_note_3: 'Ваша интуиция была права. Когда вам исполняется 200 лет, вы слышите зловещий гул от амулета. Из его поверхности появляется рот и начинает хохотать, произнося: "Так вы зашли так далеко... Готовы ли вы принять <span class="color-evil">зло</span>?"'
rebirth_note_3_hint: 'Амулет может трансформироваться ещё дальше после проживания <b>тысячелетия</b>.'
rebirth_note_3_info: 'Если вы решите принять <span class="color-evil">зло</span>, все ваши уровни, монеты и даже максимальные уровни будут сброшены. Вы переродитесь с чистого листа. Однако вы разблокируете новую линию навыков и получите <b><span class="color-evil"><span id="evilGainDisplay"></span> зла</span></b>, что сильно повлияет на ваши будущие жизни.'
rebirth_note_4: 'Тысяча лет прошла, и вы всё ещё живы... каким-то образом. Вы чувствуете, как амулет снова дрожит, и к вашему удивлению, из него появляются маленькие щупальца с глазами. Когда вы собираетесь бросить амулет, вы слышите пугающий визг, за которым следуют шёпот в вашей голове... <b>"Вы должны принять Бездну..."</b>'
rebirth_note_4_hint: 'Амулет достигнет своей финальной формы после <b>десяти тысячелетий</b>!'
rebirth_note_4_unlock: 'Вы разблокировали категорию классов <b>"Бездна"</b> вместе с навыками <b>"Манипуляция Бездной"</b>.'
rebirth_note_5: 'Десять тысячелетий прошли... большинство из них проведено на службе у Бездны, но в вас всё ещё есть проблеск человечности. Внезапно ваш амулет начинает светить вдали, освещая тьму вокруг яркостью тысячи солнц. С последним остатком свободной воли вы бежите к амулету и прикасаетесь к нему... <b>"Теперь вы часть чего-то большего, чем вы сами..."</b>'
rebirth_note_5_unlock: 'Вы разблокировали категорию классов <b>"Галактический Совет"</b> вместе с навыками <b>"Небесные силы"</b>.'
rebirth_note_5_info: 'Если вы решите <b>трансцендировать</b>, вы переродитесь снова, потеряв все монеты, <b><span class="color-evil">зло</span></b>, текущие и максимальные уровни. Однако вы получите <b><span class="color-essence"><span id="essenceGainDisplay"></span> эссенции</span></b> вместе с новыми навыками, которые помогут вам в вашем путешествии.'
rebirth_note_5_warning: 'Трансцендирование появится только если у вас разблокирован навык <b>"Эхо былых жизней"</b>!'
rebirth_note_6: 'Вы начали осваивать "Эхо былых жизней", открыв путь к трансцендированию.'
rebirth_note_7: Вы становитесь слишком могущественным. Конец вселенной может быть близок...
rebirth_note_7_info: 'Если вы решите <b>свернуть вселенную</b>, все ваши уровни, монеты, максимальные уровни, <span class="color-evil">зло</span> и <b><span class="color-essence">эссенция</span></b> будут сброшены. Вы переродитесь с чистого листа в новой вселенной, без памяти о вехах и испытаниях прошлых жизней. Взамен вы разблокируете третью линию навыков и получите <b><span class="color-dark-matter"><span id="darkMatterGainDisplay"></span> тёмной материи</span></b>, что значительно усилит вас в путешествии по мультивселенной.'
rebirth_note_8: Вы открыли Метавселенную!
rebirth_note_8_info: Когда вы перейдёте в Метавселенную, вы потеряете всё, что заработали ранее. Вы начнёте с нуля, но со временем станете намного сильнее.
hypercube_cap_text: 'Ваш лимит <span class="color-hypercubes">гиперкубов</span> будет увеличен до <span class="color-hypercubes"><span id="hypercubeCapDisplay"></span></span>.'
perk_points_gain_text: 'Вы получите <span class="color-perk-points"><span id="perkPointsGainDisplay"></span> очков даров Метавселенной</span>.'

