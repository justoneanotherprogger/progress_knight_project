tt_milestone_mind_control_name: Вы подчиняете Дьявола своей воле — и зло изливается
  из него всё более полноводной рекой.
tt_milestone_galactic_emperor_name: Будучи командующим Галактического совета, вы автоматически
  собираете эссенцию с близлежащих планет.
tt_milestone_dark_matter_harvester_name: Вы собираете урожай со вселенной, вытягивая
  из неё всё больше тёмной материи.
tt_milestone_a_dark_era_name: Вы начинаете новую эру тёмной материи.
tt_milestone_dark_orbiter_name: Толикой чародейства вы заметно усиливаете свои генераторы
  тёмных сфер.
tt_milestone_dark_matter_mining_name: Вы добываете огромные объёмы тёмной материи
  на каждой посещённой планете.
tt_milestone_the_new_gold_name: Эссенция может стать новым золотом — её используют
  повсюду.
tt_milestone_the_devil_inside_you_name: Деловые теневые сделки с Дьяволом дают вам
  огромный бонус к злу.
tt_milestone_strange_magic_name: Странный волшебник предлагает вам несколько секретных
  заклинаний, которые могут пригодиться.
tt_milestone_life_is_valueable_name: Время ограничено... даже для правителя вселенной.
tt_milestone_speed_speed_speed_name: Своим гигантским запасом тёмной материи вы можете
  влиять на скорость вселенной.
tt_milestone_dark_matter_millionaire_name: Это заклинание поможет вам осуществить
  мечту — стать первым, кто накопит миллион тёмной материи.
tt_milestone_the_new_dark_matter_name: Ваш амулет разрывает пространство и время во
  всех мультивселенных. Добро пожаловать в Метавселенную.
tt_milestone_strong_hope_name: Ещё одно усиление «Слабой надежды»?!
tt_milestone_ruler_of_the_metaverse_name: Теперь вы мыслите порталами — а Метавселенная
  мыслит вами.
tt_milestone_a_new_hope_name: Долой эту надоевшую «Слабую надежду»!!!
tt_milestone_time_is_a_flat_circle_name: Это мир, в котором ничто не решается. Кто-то
  однажды сказал, что время — плоский круг. Всё, что мы делали и будем делать, повторится
  снова и снова.
tt_milestone_the_end_is_near_name: Мы не пытаемся жить вечно.
tt_milestone_the_end_name: У всего есть конец.
