# Tooltips: Dark Milestones
tt_Mind Control: Вы подчиняете Дьявола своей воле — и зло изливается из него всё более полноводной рекой.
tt_Galactic Emperor: Будучи командующим Галактического совета, вы автоматически собираете эссенцию с близлежащих планет.
tt_Dark Matter Harvester: Вы собираете урожай со вселенной, вытягивая из неё всё больше тёмной материи.
tt_A Dark Era: Вы начинаете новую эру тёмной материи.
tt_Dark Orbiter: Толикой чародейства можно серьёзно прокачать свои генераторы тёмных сфер.
tt_Dark Matter Mining: Вы добываете огромные объёмы тёмной материи на каждой посещённой планете.
tt_The new gold: Эссенция может стать новым золотом — её используют повсюду.
tt_The Devil inside you: Деловые теневые сделки с Дьяволом дают вам огромный бонус к злу.
tt_Strange Magic: Странный волшебник предлагает вам несколько секретных заклинаний, которые могут пригодиться.
tt_Life is valueable: Время ограничено... даже для правителя вселенной.
tt_Speed speed speed: Своим гигантским запасом тёмной материи вы можете влиять на скорость вселенной.
tt_Dark Matter Millionaire: Это заклинание поможет вам осуществить мечту — стать первым, кто накопит миллион тёмной материи.
tt_The new Dark Matter: Ваш амулет разрывает пространство и время во всех мультивселенных. Добро пожаловать в Метавселенную.
tt_Strong Hope: Ещё одно усиление «Слабой надежды»?!
tt_Ruler of the Metaverse: Теперь вы мыслите порталами — а Метавселенная мыслит вами.
tt_A New Hope: Долой эту надоевшую «Слабую надежду»!!!
tt_Time is a flat circle: Это мир, в котором ничто не решается. Кто-то однажды сказал, что время — плоский круг. Всё, что мы делали и будем делать, повторится снова и снова.
tt_The End is near: Мы не пытаемся жить вечно.
tt_The End: У всего есть конец.