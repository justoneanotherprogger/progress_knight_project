# Tooltips: Skills (Void Manipulation/Celestial Powers/Almightiness/Darkness)
tt_Absolute Wish: Способность исполнять решительно любые желания без каких-либо ограничений.
tt_Void Amplification: Вы отдаёте себя Бездне, отчего ей становится проще взять вас под контроль.
tt_Mind Release: В трансе вы ощущаете, как Бездна усиливает ваши мысли, восприятие, воспоминания, эмоции и личность.
tt_Ceaseless Abyss: Бесконечная пытка — вы поклялись служить Бездне до конца существования.
tt_Void Symbiosis: Симбиотическая связь, помогающая вам стать с Бездной единым целым.
tt_Void Embodiment: Если долго смотреть в бездну, бездна начнёт смотреть в вас.
tt_Abyss Manipulation: Позволяет формировать собственную реальность внутри самой Бездны.
tt_Cosmic Longevity: Вы видели всё — от самого начала до самого конца.
tt_Cosmic Recollection: Умение существовать в множестве параллельных временных линий и управлять своими двойниками, влияя на их судьбы по своему усмотрению.
tt_Essence Collector: Вы обращаете безграничный потенциал энергий мультивселенной в свою пользу и собираете её ресурсы.
tt_Galactic Command: Абсолютная власть развращает абсолютно.
tt_Yin Yang: Рождённый из хаоса при создании вселенной, он, как считается, существует в гармонии, уравновешивая зло и добро.
tt_Parallel Universe: Самодостаточный план бытия, сосуществующий с вашим собственным и помогающий восстановить фрагменты забытой силы.
tt_Higher Dimensions: Сила частично менять законы физики и выход за пределы низших измерений делают ваше существование бесконечным.
tt_Epiphany: Вы становитесь едины со всем сущим.
tt_Dark Prince: Вы можете пугающе быстро наращивать свой интеллект благодаря доступу ко всем библиотекам вселенной.
tt_Dark Ruler: Правя вселенной, вы собираете больше тёмной материи со своих подчинённых.
tt_Immortal Ruler: У вас лишь одна цель — править вселенной до бесконечности.
tt_Dark Magician: Запретной магией над подчинёнными вы выжимаете из них каждую каплю эссенции.
tt_Universal Ruler: Правив железной рукой, вы добиваетесь, чтобы никто не смел оспорить вашу власть.
tt_Blinded By Darkness: Ослеплённый тьмой, вы больше не властны над собой. Вы начинаете крушить всё сущее, чтобы успокоиться.