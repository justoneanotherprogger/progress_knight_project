# Tooltips: Skills (Void Manipulation/Celestial Powers/Almightiness/Darkness)
skill_absolute_wish_desc: Способность исполнять решительно любые желания без каких-либо ограничений.
skill_void_amplification_desc: Вы отдаёте себя Бездне, отчего ей становится проще взять вас под контроль.
skill_mind_release_desc: В трансе вы ощущаете, как Бездна усиливает ваши мысли, восприятие, воспоминания, эмоции и личность.
skill_ceaseless_abyss_desc: Бесконечная пытка — вы поклялись служить Бездне до конца существования.
skill_void_symbiosis_desc: Симбиотическая связь, помогающая вам стать с Бездной единым целым.
skill_void_embodiment_desc: Если долго смотреть в бездну, бездна начнёт смотреть в вас.
skill_abyss_manipulation_desc: Позволяет формировать собственную реальность внутри самой Бездны.
skill_cosmic_longevity_desc: Вы видели всё — от самого начала до самого конца.
skill_cosmic_recollection_desc: Умение существовать в множестве параллельных временных линий и управлять своими двойниками, влияя на их судьбы по своему усмотрению.
skill_essence_collector_desc: Вы обращаете безграничный потенциал энергий мультивселенной в свою пользу и собираете её ресурсы.
skill_galactic_command_desc: Абсолютная власть развращает абсолютно.
skill_yin_yang_desc: Рождённый из хаоса при создании вселенной, он, как считается, существует в гармонии, уравновешивая зло и добро.
skill_parallel_universe_desc: Самодостаточный план бытия, сосуществующий с вашим собственным и помогающий восстановить фрагменты забытой силы.
skill_higher_dimensions_desc: Сила частично менять законы физики и выход за пределы низших измерений делают ваше существование бесконечным.
skill_epiphany_desc: Вы становитесь едины со всем сущим.
skill_dark_prince_desc: Вы можете пугающе быстро наращивать свой интеллект благодаря доступу ко всем библиотекам вселенной.
skill_dark_ruler_desc: Правя вселенной, вы собираете больше тёмной материи со своих подчинённых.
skill_immortal_ruler_desc: У вас лишь одна цель — править вселенной до бесконечности.
skill_dark_magician_desc: Запретной магией над подчинёнными вы выжимаете из них каждую каплю эссенции.
skill_universal_ruler_desc: Правив железной рукой, вы добиваетесь, чтобы никто не смел оспорить вашу власть.
skill_blinded_by_darkness_desc: Ослеплённый тьмой, вы больше не властны над собой. Вы начинаете крушить всё сущее, чтобы успокоиться.