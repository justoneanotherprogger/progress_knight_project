# Tooltips: Galactic Council + Metaverse Guards
tt_Eternal Wanderer: С силами, дарованными неведомой сущностью, вы скитаетесь по местам, что одни почитают, а другие боятся, в поисках ответов.
tt_Nova: Чрезвычайно могучее существо с колоссальными телекинетическими силами и способностью перестраивать молекулярную структуру материи и энергии вплоть до космического масштаба.
tt_Sigma Proioxis: Почти всемогущая космологическая сущность с огромными способностями к манипуляции материей и энергией, что помогает вам раздвинуть пределы самой Вселенной.
tt_Acallaris: Первозданное существо, появившееся раньше вселенной, причастное к созданию жизни и могущественное за гранью смертного понимания; для древнейших видов вселенной вы — миф.
tt_One Above All: Создатель всего сущего.
tt_Snow Crash: Снежный крах, 1992
tt_Player One: Первому игроку приготовиться, 2011
tt_Lost in the dark: Они оба знали, что смогут двигаться вперёд лишь рядом друг с другом. Они поклялись всегда быть вместе, заработать много денег и перебраться в место лучше, где им будет очень хорошо.
tt_Omega: ω